name: publish public service base
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag vMAJOR.MINOR.PATCH'
        required: true
        type: string
      publish_kiro:
        description: 'Publish the complete CLI image to a private package under your applicable provider agreement'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
  publish:
    needs: validate
    # Configure this environment with required reviewers for manual publication authorization.
    environment: ghcr-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate requested tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.13'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.5'}
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy src
      - run: uv run pytest -q -m 'not integration and not kiro'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        env: {REPOSITORY: '${{ github.repository }}'}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: '${{ env.IMAGE }}:${{ env.RELEASE_TAG }}'
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
  publish-private-kiro:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_kiro
    needs: validate
    environment: ghcr-kiro-private
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release tag
        env: {REQUESTED_TAG: '${{ inputs.tag }}'}
        run: |
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Require private package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: python3 scripts/check_private_package.py
      - name: Image and provider version
        env: {REPOSITORY: '${{ github.repository }}'}
        run: |
          echo "IMAGE=ghcr.io/${REPOSITORY,,}-kiro" >> "$GITHUB_ENV"
          python3 -c 'import json,os; p=json.load(open("src/kiro_headless_service/kiro-release.json")); open(os.environ["GITHUB_ENV"],"a").write("CLI_VERSION="+p["version"]+"\n")'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: kiro
          platforms: linux/amd64,linux/arm64
          push: true
          tags: '${{ env.IMAGE }}:${{ env.RELEASE_TAG }}-kiro${{ env.CLI_VERSION }}'
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            io.kiro.cli.version=${{ env.CLI_VERSION }}
            io.kiro.agent.engine=v3
