name: publish public runtime
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag vMAJOR.MINOR.PATCH'
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
  publish:
    needs: validate
    # Configure this environment with required reviewers for manual publication authorization.
    environment: ghcr-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate requested tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.13'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.5'}
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy src
      - run: uv run pytest -q -m 'not integration and not kiro'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        env: {REPOSITORY: '${{ github.repository }}'}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: '${{ env.IMAGE }}:${{ env.RELEASE_TAG }}'
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
      - name: Verify anonymous pull
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          task_auth_dir="$(mktemp -d)"
          trap 'rm -rf "$task_auth_dir"' EXIT
          if ! DOCKER_CONFIG="$task_auth_dir" docker pull "$IMAGE@$IMAGE_DIGEST"; then
            echo "::error::Set the GHCR package visibility to Public in Package settings, then rerun publication. The image was pushed, but anonymous pull failed."
            exit 1
          fi
