name: kiro-headless-service
x-service: &service
  image: ${KHS_IMAGE:-kiro-headless-service:local}
  build: .
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  mem_limit: 1g
  tmpfs:
    - "/tmp:rw,nosuid,nodev,size=512m,mode=1777"
  volumes:
    - ${KHS_CONFIG_FILE:-./examples/service.json}:/config/service.json:ro
    - ${KHS_KIRO_CONFIG_HOST_DIR:-./examples/kiro}:/config/kiro:ro
  environment: &environment
    KHS_DATABASE_URL: postgresql+psycopg://kiro:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/kiro
    KHS_ENGINE: ${KHS_ENGINE:-kiro}
    KHS_KIRO_CONFIG_DIR: /config/kiro
    KHS_CLI_BOOTSTRAP: ${KHS_CLI_BOOTSTRAP:-download}
    KHS_CLI_CACHE_DIR: /var/lib/kiro
    KHS_KIRO_PROXY_ENV_REFS: "${KHS_KIRO_PROXY_ENV_REFS:-{}}"
    SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:?Set a unique API token of at least 24 characters}
  depends_on:
    postgres: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_DB: kiro
      POSTGRES_USER: kiro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U kiro -d kiro"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *service
    command: [migrate]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *service
    command: [api]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    <<: *service
    command: [worker]
    environment:
      <<: *environment
      KIRO_API_KEY: ${KIRO_API_KEY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres}
    volumes:
      - ${KHS_CONFIG_FILE:-./examples/service.json}:/config/service.json:ro
      - ${KHS_KIRO_CONFIG_HOST_DIR:-./examples/kiro}:/config/kiro:ro
      - kiro-cli:/var/lib/kiro
    stop_grace_period: 20s
    restart: unless-stopped
volumes:
  kiro-cli:
  postgres:
